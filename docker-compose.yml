# The "client's staging environment": Ghost + a fake inbox for magic-link emails.
services:
  ghost:
    image: ghost:6.78.0-alpine
    ports: ["2368:2368"]
    environment:
      NODE_ENV: development
      url: http://localhost:2368
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: 1025
      mail__options__secure: "false"
      security__staffDeviceVerification: "false"
      # Staging-only: an E2E suite signs up many members from one IP.
      # Production keeps Ghost's default spam protection.
      spam__member_login__freeRetries: "100000"
      spam__member_login__minWait: "1"
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
